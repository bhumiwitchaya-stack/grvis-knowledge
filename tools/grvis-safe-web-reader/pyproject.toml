[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grvis-safe-web-reader"
version = "0.4.0"
description = "Bounded public HTML/PDF reader, coordinator and local stdio MCP"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
pdf = ["pypdf==6.10.0"]

[project.scripts]
grvis-safe-web-reader = "grvis_safe_web_reader.cli:main"
grvis-research-mcp = "grvis_safe_web_reader.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
